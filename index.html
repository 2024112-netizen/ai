<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>스마트 감자 역병 진단 시스템</title>

    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>

    <style>
        /* 모바일 전체 화면 및 터치 방지 스타일 (농업 친화적 그린 테마) */
        body {
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
            margin: 0;
            padding: 0;
            background: #0b1311; /* 깊은 녹색조가 감도는 어두운 배경 */
            color: #f1f5f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        header {
            width: 100%;
            padding: 20px 0 10px 0;
            text-align: center;
            background: linear-gradient(to bottom, rgba(11,19,17,1), rgba(11,19,17,0.8));
            z-index: 10;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0;
            color: #10b981; /* 에메랄드 그린 */
            text-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
        }

        p {
            font-size: 0.85rem;
            color: #94a3b8;
            margin: 5px 0 0 0;
            letter-spacing: 0.5px;
        }

        /* 상태 표시창 */
        #status {
            font-weight: bold;
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 12px;
            border: 1px solid rgba(245, 158, 11, 0.4);
            margin: 10px auto;
            backdrop-filter: blur(8px);
            display: inline-block;
            transition: all 0.3s ease;
        }

        /* 📱 모바일 카메라 카드 컨테이너 설정 (3:4 비율) */
        #canvas-container {
            position: relative;
            width: 90%;
            max-width: 420px;
            aspect-ratio: 3 / 4; 
            background: #050b09;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        video { display: none; }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* 카메라 영상 왜곡 방지 */
        }
    </style>
</head>
<body>

    <header>
        <h1>🌱 Potato Guard AI</h1>
        <p>실시간 감자 잎 역병 진단 시스템</p>
        <div id="status">⏳ AI 진단 엔진 로드 중...</div>
    </header>

    <div id="canvas-container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="display_canvas"></canvas>
    </div>

<script>
const video = document.getElementById('webcam');
const canvas = document.getElementById('display_canvas');
const ctx = canvas.getContext('2d');
const statusDiv = document.getElementById('status');

let session;
// 🎯 학습 모델 해상도 스펙 규격 지정 (imgsz=416)
const modelWidth = 416;
const modelHeight = 416;

// 🏷️ 클래스 인덱스 순서 분리 고정 (0: 정상, 1: 역병)
const labels = ['정상 (Normal)', '감자 역병 (Late Blight)'];

async function startApp() {
    try {
        // 모바일 후면 카메라 최적화 스트리밍 설정
        const stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: { ideal: "environment" },
                width: { ideal: 640 },
                height: { ideal: 480 }
            },
            audio: false
        });
        video.srcObject = stream;
        await video.play();

        statusDiv.innerText = "⚡ 실시간 검사 가동 준비 중...";
        statusDiv.style.background = "rgba(16, 185, 129, 0.15)";
        statusDiv.style.color = "#10b981";
        statusDiv.style.borderColor = "rgba(16, 185, 129, 0.4)";

        // ONNX 모델 로드 (WASM 아키텍처 활성화)
        session = await ort.InferenceSession.create('./best.onnx', { executionProviders: ['wasm'] });

        statusDiv.innerText = "🔬 실시간 잎 진단 중 (후면 카메라)";
        statusDiv.style.background = "rgba(16, 185, 129, 0.25)";
        statusDiv.style.color = "#34d399";
        statusDiv.style.borderColor = "rgba(52, 211, 153, 0.6)";

        // 실제 카메라 해상도를 캔버스에 동기화
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        // 진단 루프 시작
        requestAnimationFrame(processFrame);
    } catch (err) {
        statusDiv.innerText = "❌ 에러: 카메라 권한이 없거나 모델(best.onnx)을 찾을 수 없습니다.";
        statusDiv.style.background = "rgba(239, 68, 68, 0.2)";
        statusDiv.style.color = "#f87171";
        statusDiv.style.borderColor = "rgba(248, 113, 113, 0.5)";
        console.error(err);
    }
}

async function processFrame() {
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
        // 1. 배경에 원본 카메라 프레임 렌더링
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        // 2. 416x416 정방형 데이터 전처리 및 정규화
        const inputTensor = preprocess(video, modelWidth, modelHeight);

        if (inputTensor) {
            try {
                // 3. AI 경량 추론 연산 가동
                const outputs = await session.run({ images: inputTensor });
                const output = outputs[Object.keys(outputs)[0]]; 

                // 4. 결과 분석 및 화면 렌더링
                postprocess(output.data, output.dims);
            } catch (e) {
                console.error("추론 중 오류가 발생했습니다:", e);
            }
        }
    }
    // ⚠️ 과부하 방지: 이전 프레임의 연산 및 렌더링이 완전히 완료된 직후 다음 프레임을 호출
    requestAnimationFrame(processFrame);
}

function preprocess(img, width, height) {
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = width;
    tempCanvas.height = height;
    const tempCtx = tempCanvas.getContext('2d');

    // 비틀림 방지 압축 리사이징
    tempCtx.drawImage(img, 0, 0, width, height);

    const imgData = tempCtx.getImageData(0, 0, width, height);
    const data = imgData.data;

    const r = new Float32Array(width * height);
    const g = new Float32Array(width * height);
    const b = new Float32Array(width * height);

    // R, G, B 채널 분리 및 [0, 1] 스케일 정규화
    for (let i = 0; i < data.length / 4; i++) {
        r[i] = data[i * 4] / 255.0;
        g[i] = data[i * 4 + 1] / 255.0;
        b[i] = data[i * 4 + 2] / 255.0;
    }

    const float32Data = new Float32Array(width * height * 3);
    float32Data.set(r, 0);
    float32Data.set(g, width * height);
    float32Data.set(b, width * height * 2);

    return new ort.Tensor('float32', float32Data, [1, 3, width, height]);
}

function postprocess(data, dims) {
    const numAttributes = dims[1]; // 속성 축 크기 (cx, cy, w, h, class0_score, class1_score)
    const numBoxes = dims[2];      // 그리드 박스 총수 (3549)

    let candidates = [];

    // 임계값을 넘긴 신뢰도 높은 후보군 1차 추출
    for (let i = 0; i < numBoxes; i++) {
        let maxScore = 0;
        let classId = -1;

        for (let c = 4; c < numAttributes; c++) {
            const score = data[c * numBoxes + i];
            if (score > maxScore) {
                maxScore = score;
                classId = c - 4;
            }
        }

        // 야외 밭 농가 환경을 고려하여 신뢰도 임계값 0.40 설정
        if (maxScore > 0.40) {
            const cx = data[0 * numBoxes + i] / modelWidth * canvas.width;
            const cy = data[1 * numBoxes + i] / modelHeight * canvas.height;
            const w = data[2 * numBoxes + i] / modelWidth * canvas.width;
            const h = data[3 * numBoxes + i] / modelHeight * canvas.height;

            const x = cx - w / 2;
            const y = cy - h / 2;

            candidates.push({ x, y, w, h, score: maxScore, classId });
        }
    }

    // 비최대 억제(NMS) 알고리즘 적용하여 중복 경계상자 제거
    candidates.sort((a, b) => b.score - a.score);
    let selectedObjects = [];

    while (candidates.length > 0) {
        let box = candidates.shift();
        selectedObjects.push(box);

        candidates = candidates.filter(item => {
            if (item.classId !== box.classId) return true;

            const interX1 = Math.max(box.x, item.x);
            const interY1 = Math.max(box.y, item.y);
            const interX2 = Math.min(box.x + box.w, item.x + item.w);
            const interY2 = Math.min(box.y + box.h, item.y + item.h);

            if (interX2 > interX1 && interY2 > interY1) {
                const interArea = (interX2 - interX1) * (interY2 - interY1);
                const boxArea = box.w * box.h;
                const itemArea = item.w * item.h;
                const iou = interArea / (boxArea + itemArea - interArea);
                return iou < 0.45; // IoU 45% 이상 겹치면 동일 객체 취급 제거
            }
            return true;
        });
    }

    // 잎 경계 상자 및 위험도 컬러 시각화 렌더링
    selectedObjects.forEach(obj => {
        // 역병(1)이면 위험을 알리는 '적홍색(#ef4444)', 정상(0)이면 안전을 뜻하는 '희망찬 녹색(#10b981)'
        const isBlight = obj.classId === 1;
        const themeColor = isBlight ? "#ef4444" : "#10b981";

        // 1. 박스 테두리 그리기
        ctx.strokeStyle = themeColor;
        ctx.lineWidth = isBlight ? 4 : 3; // 역병은 더 두껍게 강조
        ctx.strokeRect(obj.x, obj.y, obj.w, obj.h);

        // 2. 상단 텍스트 태그 생성
        const labelName = labels[obj.classId] || "미확인 객체";
        const text = `${labelName} ${Math.round(obj.score * 100)}%`;

        ctx.font = "bold 13px sans-serif";
        const textWidth = ctx.measureText(text).width;
        const labelY = obj.y - 22 < 0 ? 0 : obj.y - 22;

        // 라벨 배경 박스
        ctx.fillStyle = themeColor;
        ctx.fillRect(obj.x - 1, labelY, textWidth + 12, 22);

        // 라벨 내부 텍스트 폰트 색상 설정
        ctx.fillStyle = "#ffffff";
        ctx.fillText(text, obj.x + 6, labelY + 16);
    });
}

window.onload = startApp;
</script>
</body>
</html>
